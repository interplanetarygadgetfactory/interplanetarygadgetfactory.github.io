<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Piano Studio — Lesson Booking</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap');
html, body { margin: 0; padding: 0; }
button:hover:not(:disabled){ transform: translateY(-1px); }
input, textarea, select { font-family:'Inter',sans-serif; }
input:focus, textarea:focus, select:focus, button:focus-visible { outline: 2px solid #A8323E; outline-offset: 2px; }
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="env,react">

/* ═════════════════════════════════════════════════════════════
   ▼▼▼  STEP 1 of setup: paste your two Supabase values here  ▼▼▼
   (Both come from Supabase → Project Settings → API)
   ═════════════════════════════════════════════════════════════ */
const SUPABASE_URL = "https://vxvemhedqnnbkmlwnigx.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_8kWuqsDvGTu4iBn3iWRy4g_wcoonDn0";
/* ═════════════════════════════════════════════════════════════ */

const { useState, useEffect, useCallback, useRef } = React;

const CONFIGURED = !SUPABASE_URL.includes("PASTE") && !SUPABASE_ANON_KEY.includes("PASTE");
const sb = CONFIGURED ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
const SITE_URL = window.location.origin + window.location.pathname;

const C = {
  ivory: "#FAF7F1", paper: "#FFFFFF", ebony: "#211E1A", inkSoft: "#5C564D",
  line: "#E4DED2", felt: "#A8323E", feltSoft: "#F6E4E6", brass: "#8A6D3B",
  brassSoft: "#F3ECDD", green: "#3E6B4F", greenSoft: "#E3EDE6",
};

const WEEKDAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const DEFAULT_AVAIL = {
  1: ["15:00", "16:00", "17:00", "18:00"],
  2: ["15:00", "16:00", "17:00", "18:00"],
  3: ["15:00", "16:00", "17:00", "18:00"],
  4: ["15:00", "16:00", "17:00", "18:00"],
  5: ["15:00", "16:00", "17:00", "18:00"],
  6: ["09:00", "10:00", "11:00"],
  0: [],
};
const ALL_SLOT_TIMES = [];
for (let h = 7; h <= 20; h++) ALL_SLOT_TIMES.push(`${String(h).padStart(2, "0")}:00`);

/* ── date helpers ── */
const fmtDateKey = (d) =>
  `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const parseDateKey = (k) => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const niceDate = (k) =>
  parseDateKey(k).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
const niceTime = (t) => {
  const [h, m] = t.split(":").map(Number);
  const am = h < 12;
  const hh = h % 12 === 0 ? 12 : h % 12;
  return `${hh}:${String(m).padStart(2, "0")} ${am ? "AM" : "PM"}`;
};
const todayKey = () => fmtDateKey(new Date());

/* ── UI atoms ── */
const Btn = ({ children, kind = "solid", style, ...p }) => (
  <button {...p} style={{
    fontFamily: "'Inter', sans-serif", fontSize: 14, fontWeight: 600,
    padding: "10px 18px", borderRadius: 8, cursor: p.disabled ? "default" : "pointer",
    border: kind === "ghost" ? `1px solid ${C.line}` : "1px solid transparent",
    background: kind === "solid" ? C.ebony : kind === "accent" ? C.felt : "transparent",
    color: kind === "ghost" ? C.ebony : C.ivory, opacity: p.disabled ? 0.4 : 1,
    transition: "transform .08s ease, opacity .15s", ...style,
  }}>{children}</button>
);

const Tag = ({ children, tone = "neutral" }) => {
  const tones = {
    pending: { bg: C.brassSoft, fg: C.brass },
    confirmed: { bg: C.greenSoft, fg: C.green },
    approved: { bg: C.greenSoft, fg: C.green },
    declined: { bg: C.feltSoft, fg: C.felt },
    removed: { bg: C.feltSoft, fg: C.felt },
    cancelled: { bg: "#EFECE5", fg: C.inkSoft },
    neutral: { bg: "#EFECE5", fg: C.inkSoft },
  };
  const t = tones[tone] || tones.neutral;
  return (
    <span style={{
      fontFamily: "'Inter', sans-serif", fontSize: 11, fontWeight: 600,
      letterSpacing: "0.04em", textTransform: "uppercase", padding: "3px 8px",
      borderRadius: 999, background: t.bg, color: t.fg,
    }}>{children}</span>
  );
};

const Card = ({ children, style }) => (
  <div style={{ background: C.paper, border: `1px solid ${C.line}`, borderRadius: 12, padding: 16, ...style }}>
    {children}
  </div>
);

const Staff = () => (
  <div aria-hidden style={{ margin: "4px 0 16px" }}>
    {[0, 1, 2, 3, 4].map((i) => (
      <div key={i} style={{ height: 1, background: C.line, marginBottom: 4, opacity: 1 - i * 0.18 }} />
    ))}
  </div>
);

const h2Style = { fontFamily: "'Fraunces', Georgia, serif", fontSize: 20, fontWeight: 600, margin: "0 0 6px" };
const pMuted = { color: C.inkSoft, fontSize: 14, lineHeight: 1.5, marginTop: 0 };
const inputStyle = {
  width: "100%", boxSizing: "border-box", padding: "10px 12px", fontSize: 15,
  border: `1px solid ${C.line}`, borderRadius: 8, background: C.ivory, color: C.ebony,
};
const errStyle = { color: C.felt, fontSize: 13, margin: "8px 0 0" };
const okStyle = { color: C.green, fontSize: 13, margin: "8px 0 0" };

function NotConfigured() {
  return (
    <Card style={{ maxWidth: 560, margin: "40px auto" }}>
      <h2 style={h2Style}>Almost there — connect your database</h2>
      <p style={pMuted}>
        Open <code>index.html</code> in a text editor, find the two lines near the top
        marked <strong>STEP 1</strong>, and paste in your Supabase URL and anon key.
        See the setup guide for details.
      </p>
    </Card>
  );
}

/* ═════════════════════════════════════════════════════════════
   Root: handles auth session → routes to the right screen
   ═════════════════════════════════════════════════════════════ */
function App() {
  const [session, setSession] = useState(null);
  const [profile, setProfile] = useState(null);
  const [authReady, setAuthReady] = useState(false);
  const [recovery, setRecovery] = useState(false);
  const [teacherExists, setTeacherExists] = useState(true);
  const [toast, setToast] = useState(null);
  const flash = (msg) => { setToast(msg); setTimeout(() => setToast(null), 3200); };

  const checkTeacher = useCallback(async () => {
    try {
      const { data, error } = await sb.rpc("teacher_exists");
      if (!error) setTeacherExists(!!data);
    } catch {}
  }, []);
  useEffect(() => { if (CONFIGURED) checkTeacher(); }, [checkTeacher]);

  useEffect(() => {
    if (!CONFIGURED) return;
    sb.auth.getSession().then(({ data }) => {
      setSession(data.session); setAuthReady(true);
    });
    const { data: sub } = sb.auth.onAuthStateChange((event, sess) => {
      setSession(sess);
      if (event === "PASSWORD_RECOVERY") setRecovery(true);
      if (event === "SIGNED_OUT") { setProfile(null); setRecovery(false); }
    });
    return () => sub.subscription.unsubscribe();
  }, []);

  const loadProfile = useCallback(async () => {
    if (!session) { setProfile(null); return; }
    const { data } = await sb.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
    if (!data) {
      // Session exists but its account/profile is gone (e.g. database was
      // reset). Drop the stale session and return to the login screen.
      await new Promise((r) => setTimeout(r, 1200));
      const retry = await sb.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
      if (!retry.data) { await sb.auth.signOut(); return; }
      setProfile(retry.data);
      return;
    }
    setProfile(data);
  }, [session]);

  useEffect(() => { loadProfile(); }, [loadProfile]);

  const signOut = async () => { await sb.auth.signOut(); };

  if (!CONFIGURED)
    return <Shell><NotConfigured /></Shell>;
  if (!authReady)
    return <Shell><p style={{ color: C.inkSoft, padding: 24 }}>Opening the studio…</p></Shell>;

  if (recovery && session)
    return (
      <Shell toast={toast}>
        <SetNewPassword flash={flash} onDone={() => setRecovery(false)} />
      </Shell>
    );

  if (!session)
    return <Shell toast={toast}><AuthScreen flash={flash} teacherExists={teacherExists} /></Shell>;

  if (!profile)
    return <Shell toast={toast}><p style={{ color: C.inkSoft, padding: 24 }}>Loading your profile…</p></Shell>;

  if (!teacherExists && profile.role !== "teacher")
    return (
      <Shell toast={toast} who={profile} onSignOut={signOut}>
        <ClaimTeacher
          onClaimed={async () => { await checkTeacher(); await loadProfile(); flash("You're the teacher — welcome to your studio!"); }}
          onStudent={() => setTeacherExists(true)}
          flash={flash} />
      </Shell>
    );

  if (profile.status === "removed")
    return (
      <Shell toast={toast} who={profile} onSignOut={signOut}>
        <Card style={{ maxWidth: 520, marginTop: 24 }}>
          <h2 style={h2Style}>Account inactive</h2>
          <p style={pMuted}>
            Your studio access has been deactivated by the teacher. If you think this
            is a mistake, please contact your teacher directly.
          </p>
          <Btn onClick={signOut}>Sign out</Btn>
        </Card>
      </Shell>
    );

  if (profile.role !== "teacher" && profile.status === "pending")
    return (
      <Shell toast={toast} who={profile} onSignOut={signOut}>
        <Card style={{ maxWidth: 520, marginTop: 24 }}>
          <h2 style={h2Style}>Almost in! 🎵</h2>
          <p style={pMuted}>
            Your email is confirmed and your account is created. Your teacher just
            needs to approve you before you can book lessons — check back soon.
          </p>
          <Btn kind="ghost" onClick={signOut}>Sign out</Btn>
        </Card>
      </Shell>
    );

  if (profile.role === "teacher")
    return (
      <Shell toast={toast} who={profile} onSignOut={signOut}>
        <TeacherHome me={profile} flash={flash} />
      </Shell>
    );

  return (
    <Shell toast={toast} who={profile} onSignOut={signOut}>
      <StudentHome me={profile} flash={flash} onSignOut={signOut} />
    </Shell>
  );
}

function Shell({ children, toast, who, onSignOut }) {
  return (
    <div style={{ minHeight: "100vh", background: C.ivory, color: C.ebony, fontFamily: "'Inter', sans-serif" }}>
      <header style={{
        maxWidth: 880, margin: "0 auto", padding: "28px 16px 8px",
        display: "flex", alignItems: "baseline", justifyContent: "space-between", gap: 12,
      }}>
        <div>
          <h1 style={{ fontFamily: "'Fraunces', Georgia, serif", fontWeight: 700, fontSize: 28, margin: 0, letterSpacing: "-0.01em" }}>
            The Piano Studio
          </h1>
          <p style={{ margin: "2px 0 0", color: C.inkSoft, fontSize: 13 }}>
            Lessons, bookings & notes — all in one place
          </p>
        </div>
        {who && (
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <span style={{ fontSize: 13, color: C.inkSoft }}>
              {who.role === "teacher" ? "Teacher" : who.name || who.email}
            </span>
            <Btn kind="ghost" style={{ padding: "6px 12px" }} onClick={onSignOut}>Sign out</Btn>
          </div>
        )}
      </header>
      <main style={{ maxWidth: 880, margin: "0 auto", padding: "0 16px 64px" }}>{children}</main>
      {toast && (
        <div style={{
          position: "fixed", bottom: 20, left: "50%", transform: "translateX(-50%)",
          background: C.ebony, color: C.ivory, padding: "10px 18px", borderRadius: 8,
          fontSize: 14, boxShadow: "0 6px 24px rgba(0,0,0,.18)", zIndex: 50, maxWidth: "88%",
        }}>{toast}</div>
      )}
    </div>
  );
}

/* ═════════════════════════════════════════════════════════════
   Auth screens
   ═════════════════════════════════════════════════════════════ */
function ClaimTeacher({ onClaimed, onStudent, flash }) {
  const [busy, setBusy] = useState(false);
  const claim = async () => {
    setBusy(true);
    const { data, error } = await sb.rpc("claim_teacher");
    setBusy(false);
    if (error) { flash("Couldn't set up: " + error.message); return; }
    if (data === false) { flash("A teacher account already exists."); onStudent(); return; }
    onClaimed();
  };
  return (
    <Card style={{ maxWidth: 520, marginTop: 24 }}>
      <h2 style={h2Style}>Set up your studio</h2>
      <p style={pMuted}>
        This studio doesn't have a teacher yet. If you're the teacher, claim the
        studio now — your account becomes the teacher account that approves
        students and manages the schedule. This only works for the very first
        account; afterwards, everyone who signs up is a student.
      </p>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
        <Btn kind="accent" disabled={busy} onClick={claim}>
          {busy ? "Setting up…" : "I'm the teacher — set up my studio"}
        </Btn>
        <Btn kind="ghost" onClick={onStudent}>I'm a student</Btn>
      </div>
    </Card>
  );
}

function AuthScreen({ flash, teacherExists }) {
  const [mode, setMode] = useState(teacherExists ? "login" : "signup"); // login | signup | forgot
  useEffect(() => { if (!teacherExists) setMode("signup"); }, [teacherExists]);
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [ok, setOk] = useState("");
  const [sentTo, setSentTo] = useState(null); // email we sent a confirmation to
  const [cooldown, setCooldown] = useState(0);

  useEffect(() => {
    if (cooldown <= 0) return;
    const id = setInterval(() => setCooldown((c) => c - 1), 1000);
    return () => clearInterval(id);
  }, [cooldown > 0]);

  const resend = async () => {
    setErr("");
    const { error } = await sb.auth.resend({ type: "signup", email: sentTo });
    if (error) { setErr("Couldn't resend: " + error.message); return; }
    setOk("Confirmation email sent again — give it a minute and check spam too.");
    setCooldown(60);
  };

  const reset = () => { setErr(""); setOk(""); };

  const login = async () => {
    reset(); setBusy(true);
    const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password: pw });
    setBusy(false);
    if (error) {
      if (/confirm/i.test(error.message)) setErr("Please confirm your email first — check your inbox (and spam) for the confirmation link.");
      else setErr("Login failed: " + error.message);
    }
  };

  const signup = async () => {
    reset();
    if (!name.trim()) { setErr("Please enter your name."); return; }
    if (pw.length < 6) { setErr("Password must be at least 6 characters."); return; }
    setBusy(true);
    const { error } = await sb.auth.signUp({
      email: email.trim(), password: pw,
      options: { emailRedirectTo: SITE_URL, data: { name: name.trim() } },
    });
    setBusy(false);
    if (error) { setErr("Sign-up failed: " + error.message); return; }
    setSentTo(email.trim());
    setCooldown(60);
  };

  const forgot = async () => {
    reset(); setBusy(true);
    const { error } = await sb.auth.resetPasswordForEmail(email.trim(), { redirectTo: SITE_URL });
    setBusy(false);
    if (error) { setErr(error.message); return; }
    setOk("If that email has an account, a password-reset link is on its way. Open it on this same device.");
  };

  return (
    <div style={{ paddingTop: 8 }}>
      <Staff />
      {!teacherExists && (
        <Card style={{ maxWidth: 440, margin: "0 auto 14px", background: C.brassSoft, borderColor: C.brass }}>
          <p style={{ ...pMuted, margin: 0, fontSize: 13 }}>
            <strong>New studio!</strong> No teacher is registered yet, so this
            sign-up creates the teacher account. Students: please wait until your
            teacher has set up the studio.
          </p>
        </Card>
      )}
      <Card style={{ maxWidth: 440, margin: "0 auto" }}>
        {sentTo ? (
          <React.Fragment>
            <h2 style={h2Style}>Check your email ✉️</h2>
            <p style={pMuted}>
              We've sent a confirmation link to <strong>{sentTo}</strong>.
              Click the link in that email, then come back here and log in.
              Don't forget to check your spam folder.
            </p>
            {err && <p style={errStyle}>{err}</p>}
            {ok && <p style={okStyle}>{ok}</p>}
            <div style={{ marginTop: 14, display: "flex", gap: 8, flexWrap: "wrap" }}>
              <Btn disabled={cooldown > 0} onClick={resend}>
                {cooldown > 0 ? `Resend email (${cooldown}s)` : "Resend confirmation email"}
              </Btn>
              <Btn kind="ghost" onClick={() => { setSentTo(null); setErr(""); setOk(""); setMode("login"); }}>
                Back to log in
              </Btn>
            </div>
            <div style={{ marginTop: 16, fontSize: 13 }}>
              <LinkBtn onClick={() => { setSentTo(null); setErr(""); setOk(""); }}>
                Wrong email? Sign up again
              </LinkBtn>
            </div>
          </React.Fragment>
        ) : (
        <React.Fragment>
        <h2 style={h2Style}>
          {mode === "login" ? "Log in"
            : mode === "signup" ? (teacherExists ? "Create your account" : "Teacher sign-up")
            : "Reset password"}
        </h2>
        {mode === "signup" && (
          teacherExists ? (
            <p style={pMuted}>
              New students: sign up below, confirm your email, and your teacher will
              approve you — then you can book lessons.
            </p>
          ) : (
            <p style={pMuted}>
              Welcome! Sign up with your email to create the teacher account.
              You'll confirm your email, log in, and claim your studio — after
              that, this page becomes the student sign-up.
            </p>
          )
        )}
        <div style={{ display: "grid", gap: 10 }}>
          {mode === "signup" && (
            <input value={name} onChange={(e) => setName(e.target.value)}
              placeholder="Your name (e.g. Mia Lim)" style={inputStyle} />
          )}
          <input value={email} onChange={(e) => setEmail(e.target.value)}
            placeholder="Email" type="email" autoComplete="email" style={inputStyle} />
          {mode !== "forgot" && (
            <input value={pw} onChange={(e) => setPw(e.target.value)}
              placeholder={mode === "signup" ? "Choose a password (min 6 characters)" : "Password"}
              type="password"
              autoComplete={mode === "signup" ? "new-password" : "current-password"}
              onKeyDown={(e) => e.key === "Enter" && (mode === "login" ? login() : signup())}
              style={inputStyle} />
          )}
        </div>
        {err && <p style={errStyle}>{err}</p>}
        {ok && <p style={okStyle}>{ok}</p>}
        <div style={{ marginTop: 14, display: "flex", gap: 8, flexWrap: "wrap" }}>
          {mode === "login" && (
            <Btn disabled={busy || !email || !pw} onClick={login}>{busy ? "Logging in…" : "Log in"}</Btn>
          )}
          {mode === "signup" && (
            <Btn kind="accent" disabled={busy || !email || !pw} onClick={signup}>
              {busy ? "Creating…" : teacherExists ? "Sign up" : "Sign up as teacher"}
            </Btn>
          )}
          {mode === "forgot" && (
            <Btn disabled={busy || !email} onClick={forgot}>{busy ? "Sending…" : "Send reset link"}</Btn>
          )}
        </div>
        <div style={{ marginTop: 16, display: "flex", gap: 14, flexWrap: "wrap", fontSize: 13 }}>
          {mode !== "login" && <LinkBtn onClick={() => { reset(); setMode("login"); }}>Log in</LinkBtn>}
          {mode !== "signup" && (
            <LinkBtn onClick={() => { reset(); setMode("signup"); }}>
              {teacherExists ? "New student? Sign up" : "Teacher sign-up"}
            </LinkBtn>
          )}
          {mode !== "forgot" && <LinkBtn onClick={() => { reset(); setMode("forgot"); }}>Forgot password?</LinkBtn>}
        </div>
        </React.Fragment>
        )}
      </Card>
    </div>
  );
}

const LinkBtn = ({ children, onClick }) => (
  <button onClick={onClick} style={{
    background: "none", border: "none", padding: 0, cursor: "pointer",
    color: C.felt, fontWeight: 600, fontSize: 13, fontFamily: "'Inter', sans-serif",
  }}>{children}</button>
);

function SetNewPassword({ flash, onDone }) {
  const [pw, setPw] = useState("");
  const [pw2, setPw2] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = async () => {
    setErr("");
    if (pw.length < 6) { setErr("Password must be at least 6 characters."); return; }
    if (pw !== pw2) { setErr("Passwords don't match."); return; }
    setBusy(true);
    const { error } = await sb.auth.updateUser({ password: pw });
    setBusy(false);
    if (error) { setErr(error.message); return; }
    flash("Password updated — you're logged in.");
    onDone();
  };

  return (
    <Card style={{ maxWidth: 440, margin: "24px auto 0" }}>
      <h2 style={h2Style}>Choose a new password</h2>
      <div style={{ display: "grid", gap: 10 }}>
        <input value={pw} onChange={(e) => setPw(e.target.value)} type="password"
          placeholder="New password (min 6 characters)" style={inputStyle} />
        <input value={pw2} onChange={(e) => setPw2(e.target.value)} type="password"
          placeholder="Repeat new password" style={inputStyle} />
      </div>
      {err && <p style={errStyle}>{err}</p>}
      <Btn style={{ marginTop: 12 }} disabled={busy} onClick={submit}>
        {busy ? "Saving…" : "Save new password"}
      </Btn>
    </Card>
  );
}

function ChangePassword({ flash }) {
  const [pw, setPw] = useState("");
  const [pw2, setPw2] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = async () => {
    setErr("");
    if (pw.length < 6) { setErr("Password must be at least 6 characters."); return; }
    if (pw !== pw2) { setErr("Passwords don't match."); return; }
    setBusy(true);
    const { error } = await sb.auth.updateUser({ password: pw });
    setBusy(false);
    if (error) { setErr(error.message); return; }
    setPw(""); setPw2("");
    flash("Password updated.");
  };

  return (
    <Card style={{ marginTop: 14 }}>
      <h2 style={h2Style}>Change password</h2>
      <div style={{ display: "grid", gap: 8, maxWidth: 320 }}>
        <input value={pw} onChange={(e) => setPw(e.target.value)} type="password"
          placeholder="New password (min 6 characters)" style={inputStyle} />
        <input value={pw2} onChange={(e) => setPw2(e.target.value)} type="password"
          placeholder="Repeat new password" style={inputStyle} />
        {err && <p style={{ ...errStyle, margin: 0 }}>{err}</p>}
        <Btn disabled={busy || !pw || !pw2} onClick={submit} style={{ justifySelf: "start" }}>
          {busy ? "Saving…" : "Update password"}
        </Btn>
      </div>
    </Card>
  );
}

function ChangeEmail({ me, flash }) {
  const [email, setEmail] = useState("");
  const [err, setErr] = useState("");
  const [ok, setOk] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = async () => {
    setErr(""); setOk("");
    if (!/\S+@\S+\.\S+/.test(email)) { setErr("Please enter a valid email address."); return; }
    setBusy(true);
    const { error } = await sb.auth.updateUser(
      { email: email.trim() },
      { emailRedirectTo: SITE_URL }
    );
    setBusy(false);
    if (error) { setErr(error.message); return; }
    setOk("Confirmation links sent! Check BOTH your current inbox and the new one, and click the link in each to complete the change.");
    setEmail("");
  };

  return (
    <Card style={{ marginTop: 14 }}>
      <h2 style={h2Style}>Change email address</h2>
      <p style={pMuted}>
        Currently signed in as <strong>{me.email}</strong>. For security, you'll
        receive confirmation links at both your current and new address.
      </p>
      <div style={{ display: "grid", gap: 8, maxWidth: 320 }}>
        <input value={email} onChange={(e) => { setErr(""); setOk(""); setEmail(e.target.value); }}
          type="email" placeholder="New email address" style={inputStyle} />
        {err && <p style={{ ...errStyle, margin: 0 }}>{err}</p>}
        {ok && <p style={{ ...okStyle, margin: 0 }}>{ok}</p>}
        <Btn disabled={busy || !email} onClick={submit} style={{ justifySelf: "start" }}>
          {busy ? "Sending…" : "Change email"}
        </Btn>
      </div>
    </Card>
  );
}

/* ═════════════════════════════════════════════════════════════
   Shared data hooks/helpers
   ═════════════════════════════════════════════════════════════ */
async function fetchSettings() {
  const { data } = await sb.from("settings").select("*").eq("id", 1).maybeSingle();
  return data || { id: 1, availability: DEFAULT_AVAIL, lesson_minutes: 60 };
}

function Tabs({ items, active, onChange, badges = {} }) {
  return (
    <nav style={{ display: "flex", gap: 4, borderBottom: `1px solid ${C.line}`, margin: "16px 0 20px", overflowX: "auto" }}>
      {items.map((t) => (
        <button key={t} onClick={() => onChange(t)} style={{
          fontFamily: "'Inter', sans-serif", fontSize: 14,
          fontWeight: active === t ? 600 : 500, color: active === t ? C.ebony : C.inkSoft,
          background: "none", border: "none",
          borderBottom: active === t ? `2px solid ${C.felt}` : "2px solid transparent",
          padding: "10px 12px", cursor: "pointer", whiteSpace: "nowrap",
        }}>
          {t}
          {badges[t] ? (
            <span style={{ marginLeft: 6, background: C.felt, color: "#fff", borderRadius: 999, fontSize: 11, padding: "1px 7px" }}>
              {badges[t]}
            </span>
          ) : null}
        </button>
      ))}
    </nav>
  );
}

function upcoming(bookings) {
  const t = todayKey();
  return bookings
    .filter((b) => b.lesson_date >= t && ["pending", "confirmed"].includes(b.status))
    .sort((a, b) => (a.lesson_date + a.lesson_time).localeCompare(b.lesson_date + b.lesson_time));
}

/* ═════════════════════════════════════════════════════════════
   TEACHER
   ═════════════════════════════════════════════════════════════ */
function TeacherHome({ me, flash }) {
  const [tab, setTab] = useState("Schedule");
  const [settings, setSettings] = useState(null);
  const [profiles, setProfiles] = useState([]);
  const [bookings, setBookings] = useState([]);
  const [messages, setMessages] = useState([]);

  const refresh = useCallback(async () => {
    const [s, p, b, m] = await Promise.all([
      fetchSettings(),
      sb.from("profiles").select("*").order("created_at"),
      sb.from("bookings").select("*"),
      sb.from("messages").select("*").order("created_at"),
    ]);
    setSettings(s);
    setProfiles(p.data || []);
    setBookings(b.data || []);
    setMessages(m.data || []);
  }, []);

  useEffect(() => { refresh(); }, [refresh]);
  useEffect(() => {
    const id = setInterval(refresh, 8000);
    return () => clearInterval(id);
  }, [refresh]);

  const nameOf = (id) => profiles.find((p) => p.id === id)?.name || "Unknown";
  const students = profiles.filter((p) => p.role !== "teacher");
  const pendingStudents = students.filter((p) => p.status === "pending");
  const approvedStudents = students.filter((p) => p.status === "approved");
  const pendingBookings = bookings.filter((b) => b.status === "pending").length;

  const setBookingStatus = async (id, status) => {
    const { error } = await sb.from("bookings").update({ status }).eq("id", id);
    if (error) flash("Couldn't update: " + error.message);
    refresh();
  };
  const setNote = async (id, note) => {
    const { error } = await sb.from("bookings").update({ note }).eq("id", id);
    if (error) flash("Couldn't save note: " + error.message);
    refresh();
  };
  const setStudentStatus = async (id, status) => {
    const { error } = await sb.from("profiles").update({ status }).eq("id", id);
    if (error) flash("Couldn't update student: " + error.message);
    else flash(status === "approved" ? "Student approved." : "Student removed.");
    refresh();
  };
  const send = async (studentId, text) => {
    if (!text.trim()) return;
    const { error } = await sb.from("messages").insert({
      student_id: studentId, sender_id: me.id, sender_role: "teacher",
      sender_name: "Teacher", text: text.trim(),
    });
    if (error) flash("Couldn't send: " + error.message);
    refresh();
  };
  const saveSettings = async (next) => {
    const { error } = await sb.from("settings").upsert({ id: 1, ...next });
    if (error) flash("Couldn't save: " + error.message);
    else flash("Saved.");
    refresh();
  };

  if (!settings) return <p style={{ color: C.inkSoft, padding: 24 }}>Loading…</p>;

  return (
    <div>
      <Tabs
        items={["Schedule", "Requests", "Students", "Messages", "Settings"]}
        active={tab} onChange={setTab}
        badges={{ Requests: pendingBookings, Students: pendingStudents.length }} />

      {tab === "Schedule" && (
        <TeacherSchedule bookings={bookings} nameOf={nameOf}
          onStatus={setBookingStatus} onNote={setNote} />
      )}

      {tab === "Requests" && (
        <Requests bookings={bookings} nameOf={nameOf} onStatus={setBookingStatus} />
      )}

      {tab === "Students" && (
        <StudentsAdmin pending={pendingStudents} approved={approvedStudents}
          bookings={bookings} onApprove={(id) => setStudentStatus(id, "approved")}
          onRemove={(id) => setStudentStatus(id, "removed")} />
      )}

      {tab === "Messages" && (
        <TeacherMessages students={approvedStudents} messages={messages} onSend={send} />
      )}

      {tab === "Settings" && (
        <React.Fragment>
          <Availability settings={settings} onSave={saveSettings} />
          <ChangeEmail me={me} flash={flash} />
          <ChangePassword flash={flash} />
        </React.Fragment>
      )}
    </div>
  );
}

function TeacherSchedule({ bookings, nameOf, onStatus, onNote }) {
  const list = upcoming(bookings);
  const [editing, setEditing] = useState(null);
  const [noteDraft, setNoteDraft] = useState("");

  if (list.length === 0)
    return (
      <Card>
        <p style={pMuted}>
          No upcoming lessons yet. Once approved students book, lessons appear here.
        </p>
      </Card>
    );

  let lastDate = null;
  return (
    <div style={{ display: "grid", gap: 10 }}>
      {list.map((b) => {
        const showDate = b.lesson_date !== lastDate;
        lastDate = b.lesson_date;
        return (
          <div key={b.id}>
            {showDate && (
              <p style={{ fontFamily: "'Fraunces', Georgia, serif", fontSize: 16, fontWeight: 600, margin: "14px 0 8px" }}>

            <Card style={{ display: "grid", gap: 8 }}>

                  <span style={{ color: C.inkSoft }}> — {nameOf(b.student_id)}</span>
                </div>
                <div style={{ display: "flex", gap: 8, alignItems: "center" }}>

              </div>

                <div style={{ display: "flex", gap: 8 }}>

                  }}>
                  {b.note ? `♪ ${b.note}` : "+ Add lesson note"}

              )}

          </div>
        );
      })}
    </div>
  );
}

            <Btn style={{ background: C.green, padding: "8px 14px" }}

/* ── messaging ── */

function Composer({ onSend }) {
  const [text, setText] = useState("");
  const send = () => { onSend(text); setText(""); };
  return (
    <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
      <input value={text} onChange={(e) => setText(e.target.value)}
        onKeyDown={(e) => e.key === "Enter" && send()}
        placeholder="Write a message…" style={{ ...inputStyle, flex: 1 }} />
      <Btn disabled={!text.trim()} onClick={send}>Send</Btn>

function TeacherMessages({ students, messages, onSend }) {

/* ── availability editor ── */
function Availability({ settings, onSave }) {
  const [draft, setDraft] = useState(settings.availability || DEFAULT_AVAIL);
  useEffect(() => setDraft(settings.availability || DEFAULT_AVAIL), [settings]);

  const toggle = (day, time) => {
    const cur = new Set(draft[day] || []);
    cur.has(time) ? cur.delete(time) : cur.add(time);
    setDraft({ ...draft, [day]: [...cur].sort() });
  };

  return (
    <Card>
      <h2 style={h2Style}>Weekly availability</h2>
      <p style={pMuted}>
        Tap times to open or close them. Students can only request open times.
      </p>
      <div style={{ overflowX: "auto" }}>
        <table style={{ borderCollapse: "separate", borderSpacing: 4 }}>
          <thead>
            <tr>
              <th />
              {ALL_SLOT_TIMES.map((t) => (
                <th key={t} style={{ fontSize: 10, fontWeight: 500, color: C.inkSoft, padding: "0 2px" }}>
                  {niceTime(t).replace(":00", "")}
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {[1, 2, 3, 4, 5, 6, 0].map((day) => (
              <tr key={day}>
                <td style={{ fontSize: 12, fontWeight: 600, paddingRight: 6, color: C.inkSoft }}>
                  {WEEKDAYS[day]}
                </td>
                {ALL_SLOT_TIMES.map((t) => {
                  const open = (draft[day] || []).includes(t);
                  return (
                    <td key={t}>
                      <button
                        aria-label={`${WEEKDAYS[day]} ${niceTime(t)} ${open ? "open" : "closed"}`}
                        onClick={() => toggle(day, t)}
                        style={{
                          width: 22, height: 34, borderRadius: "0 0 4px 4px",
                          border: `1px solid ${open ? C.line : C.ebony}`,
                          borderTop: `3px solid ${open ? C.felt : C.ebony}`,
                          background: open ? "#fff" : C.ebony, cursor: "pointer",
                        }} />
                    </td>
                  );
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <p style={{ ...pMuted, fontSize: 12, marginTop: 8 }}>
        White keys are open for booking; black keys are closed.
      </p>
      <Btn style={{ marginTop: 8 }} onClick={() => onSave({ availability: draft })}>
        Save availability
      </Btn>
    </Card>
  );
}

/* ═════════════════════════════════════════════════════════════
   STUDENT
   ═════════════════════════════════════════════════════════════ */
function StudentHome({ me, flash, onSignOut }) {
  const [tab, setTab] = useState("Book a lesson");
  const [settings, setSettings] = useState(null);
  const [mine, setMine] = useState([]);
  const [taken, setTaken] = useState([]);
  const [messages, setMessages] = useState([]);

  const refresh = useCallback(async () => {
    const [s, b, t, m] = await Promise.all([
      fetchSettings(),
      sb.from("bookings").select("*").eq("student_id", me.id),
      sb.rpc("taken_slots"),
      sb.from("messages").select("*").eq("student_id", me.id).order("created_at"),
    ]);
    setSettings(s);
    setMine(b.data || []);
    setTaken(t.data || []);
    setMessages(m.data || []);
  }, [me.id]);

  useEffect(() => { refresh(); }, [refresh]);
  useEffect(() => {
    const id = setInterval(refresh, 8000);
    return () => clearInterval(id);
  }, [refresh]);

  const request = async (dateKey, time) => {
    const { error } = await sb.from("bookings").insert({
      student_id: me.id, lesson_date: dateKey, lesson_time: time, status: "pending",
    });
    if (error) {
      if (error.code === "23505") flash("That time was just taken — pick another.");
      else flash("Couldn't book: " + error.message);
    } else {
      flash("Request sent — your teacher will confirm it.");
    }
    refresh();
  };

  const cancel = async (id) => {
    const { error } = await sb.from("bookings").update({ status: "cancelled" }).eq("id", id);
    if (error) flash("Couldn't cancel: " + error.message);
    refresh();
  };

  const send = async (text) => {
    if (!text.trim()) return;
    const { error } = await sb.from("messages").insert({
      student_id: me.id, sender_id: me.id, sender_role: "student",
      sender_name: me.name || me.email, text: text.trim(),
    });
    if (error) flash("Couldn't send: " + error.message);
    refresh();
  };

  if (!settings) return <p style={{ color: C.inkSoft, padding: 24 }}>Loading…</p>;

  return (
    <div>
      <Tabs items={["Book a lesson", "My lessons", "Messages", "Account"]}
        active={tab} onChange={setTab} />
      {tab === "Book a lesson" && (
        <BookLesson settings={settings} taken={taken} mine={mine} onRequest={request} />
      )}
      {tab === "My lessons" && <MyLessons mine={mine} onCancel={cancel} />}
      {tab === "Messages" && (
        <Card>
          <Thread msgs={messages} meRole="student" />
          <Composer onSend={send} />
        </Card>
      )}
      {tab === "Account" && (
        <React.Fragment>
          <Card>
            <h2 style={h2Style}>Your account</h2>
            <p style={pMuted}>
              Signed in as <strong>{me.name}</strong> ({me.email}).
            </p>
            <Btn kind="ghost" onClick={onSignOut}>Sign out</Btn>
          </Card>
          <ChangeEmail me={me} flash={flash} />
          <ChangePassword flash={flash} />
        </React.Fragment>
      )}
    </div>
  );
}

function BookLesson({ settings, taken, mine, onRequest }) {
  const days = [];
  for (let i = 1; i <= 14; i++) {
    const d = new Date(); d.setDate(d.getDate() + i); days.push(d);
  }
  const avail = settings.availability || DEFAULT_AVAIL;
  const firstWithSlots = days.find((d) => (avail[d.getDay()] || []).length > 0);
  const [selDay, setSelDay] = useState(firstWithSlots ? fmtDateKey(firstWithSlots) : fmtDateKey(days[0]));

  const takenSet = new Set(
    taken.filter((t) => t.lesson_date === selDay).map((t) => t.lesson_time)
  );
  const dayIdx = parseDateKey(selDay).getDay();
  const slots = avail[dayIdx] || [];

  return (
    <Card>
      <h2 style={h2Style}>Pick a day</h2>
      <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 6, marginBottom: 14 }}>
        {days.map((d) => {
          const k = fmtDateKey(d);
          const has = (avail[d.getDay()] || []).length > 0;
          const sel = k === selDay;
          return (
            <button key={k} onClick={() => setSelDay(k)} disabled={!has} style={{
              minWidth: 56, padding: "8px 4px", borderRadius: 8,
              border: `1px solid ${sel ? C.ebony : C.line}`,
              background: sel ? C.ebony : has ? "#fff" : "#F0EDE6",
              color: sel ? C.ivory : has ? C.ebony : "#B5AFA3",
              cursor: has ? "pointer" : "default", fontSize: 12, fontWeight: 600, textAlign: "center",
            }}>
              <div style={{ fontSize: 10, fontWeight: 500, opacity: 0.75 }}>{WEEKDAYS[d.getDay()]}</div>
              {d.getDate()}
            </button>
          );
        })}
      </div>

      <h2 style={h2Style}>{niceDate(selDay)} — open times</h2>
      {slots.length === 0 ? (
        <p style={pMuted}>The studio is closed this day.</p>
      ) : (
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
          {slots.map((t) => {
            const isTaken = takenSet.has(t);
            return (
              <button key={t} disabled={isTaken} onClick={() => onRequest(selDay, t)} style={{
                width: 84, padding: "14px 0 10px", borderRadius: "0 0 8px 8px",
                border: `1px solid ${isTaken ? C.ebony : C.line}`,
                borderTop: `4px solid ${isTaken ? C.ebony : C.felt}`,
                background: isTaken ? C.ebony : "#fff",
                color: isTaken ? "#6E6A63" : C.ebony,
                fontWeight: 600, fontSize: 14, cursor: isTaken ? "default" : "pointer",
              }}>
                {niceTime(t)}
                <div style={{ fontSize: 10, fontWeight: 500, marginTop: 2 }}>
                  {isTaken ? "taken" : "request"}
                </div>
              </button>
            );
          })}
        </div>
      )}
      <p style={{ ...pMuted, fontSize: 12, marginTop: 14 }}>
        Requests are pending until your teacher confirms them. You'll see the status under "My lessons."
      </p>
    </Card>
  );
}

function MyLessons({ mine, onCancel }) {
  const t = todayKey();
  const future = mine.filter((b) => b.lesson_date >= t && b.status !== "cancelled")
    .sort((a, b) => (a.lesson_date + a.lesson_time).localeCompare(b.lesson_date + b.lesson_time));
  const past = mine.filter((b) => b.lesson_date < t && b.status === "confirmed")
    .sort((a, b) => (b.lesson_date + b.lesson_time).localeCompare(a.lesson_date + a.lesson_time));

  return (
    <div style={{ display: "grid", gap: 16 }}>
      <div>
        <h2 style={h2Style}>Upcoming</h2>
        {future.length === 0 ? (
          <Card><p style={pMuted}>Nothing booked yet — head to "Book a lesson" to pick a time.</p></Card>
        ) : (
          <div style={{ display: "grid", gap: 10 }}>
            {future.map((b) => (
              <Card key={b.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
                <div>
                  <strong>{niceDate(b.lesson_date)}</strong>
                  <span style={{ color: C.inkSoft }}> at {niceTime(b.lesson_time)}</span>
                </div>
                <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                  <Tag tone={b.status}>{b.status}</Tag>
                  {["pending", "confirmed"].includes(b.status) && (
                    <Btn kind="ghost" style={{ padding: "6px 10px", fontSize: 13 }}
                      onClick={() => onCancel(b.id)}>Cancel</Btn>
                  )}
                </div>
              </Card>
            ))}
          </div>
        )}
      </div>
      {past.length > 0 && (
        <div>
          <h2 style={h2Style}>Past lessons</h2>
          <div style={{ display: "grid", gap: 10 }}>
            {past.map((b) => (
              <Card key={b.id}>
                <strong>{niceDate(b.lesson_date)}</strong>
                <span style={{ color: C.inkSoft }}> at {niceTime(b.lesson_time)}</span>
                {b.note && <p style={{ ...pMuted, margin: "6px 0 0", fontSize: 13 }}>♪ {b.note}</p>}
              </Card>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
